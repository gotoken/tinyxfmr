name: Shona Markov evaluation

on:
  pull_request:
    paths:
      - "scripts/evaluate_shona_markov.py"
      - "tests/test_shona_markov.py"
      - ".github/workflows/shona-markov-evaluation.yml"
      - "docs/reports/shona-markov-evaluation.md"
      - "docs/prediction-data-candidates.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Evaluate Hayes & Wilson Shona data
        run: |
          python scripts/evaluate_shona_markov.py \
            --output artifacts/shona-markov-evaluation.md \
            --json-output artifacts/shona-markov-results.json

      - name: Verify committed report is reproducible
        run: |
          python - <<'PY'
          from pathlib import Path
          committed = Path("docs/reports/shona-markov-evaluation.md").read_text(encoding="utf-8").rstrip("\n")
          generated = Path("artifacts/shona-markov-evaluation.md").read_text(encoding="utf-8").rstrip("\n")
          if committed != generated:
              raise SystemExit("committed report differs from generated report")
          PY

      - name: Show generated report in job summary
        if: always()
        run: |
          if [ -f artifacts/shona-markov-evaluation.md ]; then
            cat artifacts/shona-markov-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shona-markov-evaluation
          path: artifacts/
          if-no-files-found: error
